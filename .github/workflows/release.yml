# Builds the plugin and creates a GitHub release with the plugin ZIP attached
# when a v* tag is pushed. The version is taken from the tag, e.g. v0.1.0 -> 0.1.0.

name: Release
on:
  push:
    tags: [ 'v*' ]

jobs:

  release:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin -Pversion="${GITHUB_REF_NAME#v}"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./build/distributions/*.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
